name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        working-directory: docker
        run: docker compose build

  integration-tests:
    name: Integration tests (docker compose stack)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8" "pytest-timeout>=2" "requests>=2.31" "paho-mqtt<2.0"

      - name: Start full stack
        working-directory: docker
        run: docker compose up -d --build

      - name: Wait for coordinator HTTP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/map > /dev/null 2>&1; then
              echo "Coordinator ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Coordinator did not become ready in time"
          docker compose -f docker/docker-compose.yml logs --tail=200
          exit 1

      - name: Wait for MQTT broker
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/1883) >/dev/null 2>&1; then
              echo "MQTT broker reachable after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "MQTT broker not reachable"
          exit 1

      - name: Give service bots time to register
        run: sleep 10

      - name: Run coordinator HTTP tests
        run: pytest tests/test_coordinator.py -v

      - name: Run MQTT integration tests
        run: pytest tests/mqtt.py -v

      - name: Run decentralized assignment test
        run: pytest tests/aufgabe5.py::test_decentralized_assignment_flow -v

      - name: Dump container logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --tail=400

      - name: Tear down stack
        if: always()
        working-directory: docker
        run: docker compose down -v
